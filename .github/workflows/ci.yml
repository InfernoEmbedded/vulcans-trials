name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin_path: ./target/release/vulcans-trials
          - os: macos-latest
            bin_path: ./target/release/vulcans-trials
          - os: windows-latest
            bin_path: ./target/release/vulcans-trials.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libasound2-dev libpulse-dev libudev-dev libcairo2-dev \
            libvulkan1 mesa-vulkan-drivers \
            python3-jsonschema python3-cairosvg python3-pil

      - name: Install Python dependencies (macOS & Windows)
        if: runner.os != 'Linux'
        run: pip install jsonschema cairosvg Pillow

      - name: Ensure /tmp directory exists on Windows
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path "\tmp" | Out-Null
          New-Item -ItemType Directory -Force -Path "C:\tmp" | Out-Null

      - name: Run all tests (release mode)
        run: cargo test --release

      - name: Compile release binary
        run: cargo build --release

      - name: Execute self-verification test suite
        run: ${{ matrix.bin_path }} --self-test

      - name: Validate KiCad PCM metadata schema compliance
        run: python kicad_plugin/build_pcm.py --validate-only
