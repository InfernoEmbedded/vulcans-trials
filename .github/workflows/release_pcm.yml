name: Release KiCad PCM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: vulcans-trials
            platform: linux
            arch: x86_64
            cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary_name: vulcans-trials
            platform: linux
            arch: aarch64
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: vulcans-trials.exe
            platform: windows
            arch: x86_64
            cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: vulcans-trials
            platform: macos
            arch: x86_64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: vulcans-trials
            platform: macos
            arch: aarch64
            cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install native Linux build dependencies
        if: matrix.os == 'ubuntu-latest' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev \
            libasound2-dev libpulse-dev libudev-dev libcairo2-dev

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (Native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build release binary (Cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare binary artifact staging
        shell: bash
        run: |
          mkdir -p stage/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} stage/${{ matrix.target }}/

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: stage/${{ matrix.target }}/${{ matrix.binary_name }}
          if-no-files-found: error

  package-and-publish:
    name: Package KiCad PCM & Publish Release
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev
          pip install jsonschema cairosvg Pillow

      - name: Download all compiled binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: staged_binaries

      - name: Extract release version tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="1.0.0"
          fi
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building KiCad PCM release v$VERSION"

      - name: Generate crisp icons
        run: |
          python3 kicad_plugin/generate_icon.py
          python3 scripts/generate_app_icons.py

      - name: Build universal and platform-bundled KiCad PCM packages
        shell: bash
        run: |
          mkdir -p dist/pcm dist/binaries

          # Package KiCad PCM packages using unified packaging script
          python3 scripts/build_kicad_packages.py \
            --bin-dir staged_binaries \
            --out-dir dist/pcm \
            --version "$RELEASE_VERSION" \
            --generate-repo \
            --no-build-native

          # Also package standalone archives for direct CLI/GUI download
          for target_dir in staged_binaries/*; do
            target_name=$(basename "$target_dir")
            target=${target_name#binary-}
            if [ -f "$target_dir/vulcans-trials" ]; then
              tar -czf "dist/binaries/vulcans-trials-v${RELEASE_VERSION}-${target}.tar.gz" -C "$target_dir" vulcans-trials
            elif [ -f "$target_dir/vulcans-trials.exe" ]; then
              zip -j "dist/binaries/vulcans-trials-v${RELEASE_VERSION}-${target}.zip" "$target_dir/vulcans-trials.exe"
            fi
          done

          # Consolidate SHA256 checksums
          cd dist
          sha256sum pcm/*.zip pcm/*.json binaries/* > SHA256SUMS.txt
          cd ..
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/pcm/*.zip
            dist/pcm/*.json
            dist/binaries/*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Deploy KiCad PCM Repository Index to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist/pcm
          keep_files: true
