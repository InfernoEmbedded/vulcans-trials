# ESPHome Configuration for Vulcan's Trials Sample Project:
# examples/esphome_1wire_sensor/esphome_1wire_sensor.kicad_pro

esphome:
  name: esphome-1wire-sensor
  friendly_name: "ESPHome 1-Wire Temperature Sensor"

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: UART0
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome

api:

# Status LED on GPIO8 (U3 Pin 7 -> R2 1k -> D1 GREEN LED)
status_led:
  pin:
    number: GPIO8
    inverted: false

# 1-Wire Bus on GPIO4 (U3 Pin 3 -> J2 Pin 2 with R3 4.7k pull-up to +3.3V)
one_wire:
  - platform: gpio
    pin: GPIO4

sensor:
  - platform: dallas_temp
    name: "Ambient Temperature"
    update_interval: 15s
    accuracy_decimals: 2
